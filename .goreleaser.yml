version: 2

builds:
  - main: ./cmd/lazybitbucket
    binary: lazybitbucket
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

brews:
  - name: lazybitbucket
    description: "Terminal UI for Bitbucket Cloud pull requests"
    homepage: "https://github.com/lsst25/lazybitbucket"
    repository:
      owner: lsst25
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

nfpms:
  - package_name: lazybitbucket
    maintainer: "lsst25 <https://github.com/lsst25>"
    homepage: "https://github.com/lsst25/lazybitbucket"
    description: "Terminal UI for Bitbucket Cloud pull requests"
    license: MIT
    formats:
      - deb
      - rpm
      - apk

aurs:
  - name: lazybitbucket-bin
    homepage: "https://github.com/lsst25/lazybitbucket"
    description: "Terminal UI for Bitbucket Cloud pull requests (prebuilt binary)"
    license: "MIT"
    private_key: "{{ .Env.AUR_SSH_PRIVATE_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/lazybitbucket-bin.git"
    provides:
      - lazybitbucket
    conflicts:
      - lazybitbucket
      - lazybitbucket-git
    package: |-
      install -Dm755 "./lazybitbucket" "${pkgdir}/usr/bin/lazybitbucket"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/lazybitbucket/LICENSE"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

changelog:
  sort: asc

release:
  footer: |
    ---
    **Full changelog:** [CHANGELOG.md](https://github.com/lsst25/lazybitbucket/blob/main/CHANGELOG.md)
